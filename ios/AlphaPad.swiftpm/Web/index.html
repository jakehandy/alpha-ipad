<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16171a">
<title>AlphaPad</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="alpha">α</span>Pad</div>
  <div class="patch">
    <button class="icon" id="prevTone" title="Previous tone in library" aria-label="Previous tone">‹</button>
    <input id="toneName" maxlength="10" spellcheck="false" autocomplete="off" aria-label="Tone name">
    <button class="icon" id="nextTone" title="Next tone in library" aria-label="Next tone">›</button>
    <span class="dirty" id="dirty" hidden>edited</span>
  </div>
  <div class="actions">
    <button id="btnCompare" title="Hold to hear the tone as it was loaded">Compare</button>
    <button id="btnSend" class="primary" title="Send the whole tone to the synth's edit buffer">Send</button>
    <button id="btnSave" title="Save to library">Save</button>
    <button id="btnLibrary" title="Open library">Library</button>
    <button id="btnKeys" class="toggle" aria-pressed="true" title="Show or hide the keyboard">Keys</button>
    <button id="btnMidi" class="midi-pill" title="MIDI settings"><span class="dot" id="midiDot"></span><span id="midiLabel">MIDI</span></button>
  </div>
</header>

<main id="panel" class="panel"></main>

<section class="keys" id="keys">
  <div class="keys-ctl">
    <button class="icon" id="octDown" aria-label="Octave down">−</button>
    <span id="octLabel">C3</span>
    <button class="icon" id="octUp" aria-label="Octave up">+</button>
    <button id="btnHold" class="toggle" aria-pressed="false">Hold</button>
    <button id="btnPanic" title="All notes off">Panic</button>
  </div>
  <div class="keybed" id="keybed"></div>
</section>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <select id="collSel" aria-label="Collection"></select>
    <button class="icon" id="collMenu" aria-label="Collection actions">⋯</button>
    <button class="icon" id="drawerClose" aria-label="Close library">✕</button>
  </div>
  <input id="search" type="search" placeholder="Search tones" autocomplete="off">
  <ol class="tone-list" id="toneList"></ol>
  <div class="drawer-foot">
    <label class="filebtn">Import .syx<input type="file" id="fileIn" multiple></label>
    <button id="btnNewColl">New collection</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div id="modalBody"></div><div class="modal-btns" id="modalBtns"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/juno.js"></script>
<script src="js/presets.js"></script>
<script src="js/midi.js"></script>
<script src="js/store.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
